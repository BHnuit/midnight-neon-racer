<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>午夜霓虹 · 极速赛车</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#06080f;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    min-height:100vh; font-family:system-ui,-apple-system,sans-serif;
    color:#cfd8e3; overflow:hidden;
  }
  #wrap { position:relative; }
  canvas { display:block; background:#0a0d16; border-radius:14px;
    box-shadow:0 0 60px rgba(90,140,255,.25), 0 0 120px rgba(255,80,160,.08);
    touch-action:none; max-width:100%; height:auto;
    border:1px solid rgba(120,160,255,.25); }
  .hud { position:absolute; top:10px; left:0; right:0;
    display:flex; justify-content:space-between; padding:0 18px;
    font-size:15px; font-weight:700; color:#e8eef7; z-index:2;
    text-shadow:0 1px 3px rgba(0,0,0,.6); }
  .hud .speed { color:#7fb0ff; font-variant-numeric:tabular-nums; }
  .hud .score { color:#ffd166; font-variant-numeric:tabular-nums; }
  .badge { position:absolute; top:38px; left:0; right:0; text-align:center;
    font-size:12px; color:#ff7ad9; z-index:2; font-weight:700; letter-spacing:1px;
    text-shadow:0 0 8px rgba(255,80,180,.5); display:none; }
  #ghostHud { position:absolute; top:56px; left:12px; z-index:2;
    font-size:11px; color:#9ad4ff; font-weight:700; text-shadow:0 1px 3px #000;
    display:none; letter-spacing:0.5px; }
  .iconBtn {
    position:absolute; top:10px; z-index:4;
    width:32px; height:32px; padding:0; margin:0;
    border:none; border-radius:8px; cursor:pointer;
    background:rgba(8,12,22,.55);
    box-shadow:none; letter-spacing:0;
    display:flex; align-items:center; justify-content:center;
    color:#9bb4d0; backdrop-filter:blur(8px);
    transition:background .15s, color .15s, transform .1s;
  }
  .iconBtn:hover { background:rgba(127,176,255,.18); color:#e8eef7; transform:none; }
  .iconBtn:active { transform:scale(.94); }
  .iconBtn svg { width:16px; height:16px; display:block; }
  .iconBtn.is-off { color:#5c6878; }
  .iconBtn.is-ok { color:#4ade80; }
  #muteBtn { right:46px; }
  #shareBtn { right:10px; }
  #overlay {
    position:absolute; inset:0; border-radius:14px;
    background:rgba(6,8,15,.88); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; z-index:3;
    text-align:center; padding:20px;
    backdrop-filter:blur(4px);
  }
  #overlay h1 { font-size:30px; letter-spacing:3px; color:#7fb0ff;
    text-shadow:0 0 20px rgba(90,140,255,.6); }
  #overlay .sub { font-size:14px; color:#8a97a8; line-height:1.7; }
  #overlay .score { font-size:44px; font-weight:800; color:#ffd166;
    text-shadow:0 0 24px rgba(255,200,80,.4); }
  #overlay .stat { font-size:13px; color:#8a97a8; }
  .legend { margin-top:4px; font-size:12px; color:#5c6878; line-height:1.9; }
  .legend b { color:#7fb0ff; } .legend .g { color:#ffd166; } .legend .p { color:#ff7ad9; }
  button {
    margin-top:6px; padding:13px 38px; font-size:17px; font-weight:800;
    color:#06080f; background:linear-gradient(135deg,#7fb0ff,#ff7ad9);
    border:none; border-radius:26px; cursor:pointer; letter-spacing:2px;
    transition:transform .1s; box-shadow:0 4px 24px rgba(127,176,255,.4);
  }
  button:hover { transform:scale(1.05); }
  button:active { transform:scale(.96); }
  button.secondary {
    background:rgba(127,176,255,.12); color:#7fb0ff;
    border:1px solid rgba(127,176,255,.4); box-shadow:none;
    padding:9px 22px; font-size:14px;
  }
  .tip { margin-top:10px; font-size:12px; color:#4a5568; }
  /* 车选择 */
  .carPicker { display:flex; gap:10px; margin-top:4px; }
  .carOption {
    width:56px; height:56px; border-radius:12px; cursor:pointer;
    border:2px solid rgba(255,255,255,.15); background:#0d1320;
    display:flex; align-items:center; justify-content:center;
    font-size:9px; color:#8a97a8; flex-direction:column; gap:2px;
    transition:border-color .1s, transform .1s;
  }
  .carOption .miniCar { width:26px; height:16px; border-radius:4px; }
  .carOption.selected { border-color:#ffd166; transform:scale(1.06); }
  .carOption span { font-size:9px; }
  /* 昵称输入 */
  .nameInput {
    padding:10px 16px; border-radius:12px; border:1px solid rgba(127,176,255,.4);
    background:rgba(10,16,28,.8); color:#e8eef7; font-size:15px; text-align:center;
    outline:none; width:200px; font-family:inherit;
  }
  .nameInput:focus { border-color:#7fb0ff; box-shadow:0 0 12px rgba(127,176,255,.3); }
  /* 排行榜 */
  .board {
    width:100%; max-height:150px; overflow-y:auto; text-align:left;
    border-radius:10px; background:rgba(10,16,28,.5); padding:4px 10px;
    font-size:12px; color:#8a97a8; scrollbar-width:thin;
  }
  .board .row { display:flex; justify-content:space-between; padding:3px 2px; border-bottom:1px solid rgba(255,255,255,.05); }
  .board .row:last-child { border-bottom:none; }
  .board .row .r { color:#ffd166; width:24px; }
  .board .row .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#cfd8e3; }
  .board .row .s { color:#7fb0ff; font-variant-numeric:tabular-nums; }
  .board .row .t { color:#5c6878; width:52px; text-align:right; font-variant-numeric:tabular-nums; }
  #rankBadge { color:#4ade80; font-size:14px; font-weight:700; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv" width="400" height="640"></canvas>
  <button id="muteBtn" class="iconBtn" title="声音" aria-label="声音">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 10v4h3l5 4V6L7 10H4z"/>
      <path d="M16 9a4 4 0 010 6"/>
      <path d="M18.5 6.5a8 8 0 010 11"/>
    </svg>
  </button>
  <button id="shareBtn" class="iconBtn" title="转发" aria-label="转发">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="2.4"/>
      <circle cx="6" cy="12" r="2.4"/>
      <circle cx="18" cy="19" r="2.4"/>
      <path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/>
    </svg>
  </button>
  <div class="ghostHud" id="ghostHud"></div>
  <div class="hud">
    <span class="speed" id="speedHud">0 km/h</span>
    <span class="score" id="scoreHud">0</span>
  </div>
  <div class="badge" id="badge"></div>
  <div id="overlay">
    <h1>午夜霓虹</h1>
    <div class="sub" id="overlaySub">霓虹夜路 · 极速狂飙<br>躲开对向车,蹭金色加速带,捡蓝色护盾<br>排行榜记录里的车手会以幻影与你同跑</div>
    <div class="legend" id="overlayLegend">
      <b>← →</b> 或 <b>A D</b> 或拖动控制<br>
      <span class="g">■ 加速带</span> 提速+双倍分 &nbsp; <span class="p">■ 护盾</span> 挡一次碰撞
    </div>
    <div class="carPicker" id="carPicker"></div>
    <input class="nameInput" id="nameInput" maxlength="12" placeholder="输入昵称(默认:车手)">
    <button id="startBtn">发车</button>
  </div>
</div>
<div class="tip">Hant 出品 · 单文件离线可玩</div>
<script>
(function(){
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const speedHud = document.getElementById('speedHud');
  const scoreHud = document.getElementById('scoreHud');
  const badge = document.getElementById('badge');
  const shareBtn = document.getElementById('shareBtn');
  const muteBtn = document.getElementById('muteBtn');
  const ghostHud = document.getElementById('ghostHud');
  const overlaySub = document.getElementById('overlaySub');
  const overlayLegend = document.getElementById('overlayLegend');
  const nameInput = document.getElementById('nameInput');
  const carPicker = document.getElementById('carPicker');

  const W = cv.width, H = cv.height;
  const LANES = 3, LANE_W = W / 3;
  const CAR_W = 46, CAR_H = 80;

  // ---- 车类型 ----
  const CAR_TYPES = [
    { name: '疾风', c1: '#9cc4ff', c2: '#2c4f8f', color: '#7fb0ff' },
    { name: '烈焰', c1: '#ff8a7a', c2: '#7a1f1f', color: '#ff5d5d' },
    { name: '雷霆', c1: '#ffe28a', c2: '#8a6a1f', color: '#ffd166' },
    { name: '魅影', c1: '#c9a8ff', c2: '#5a2f8f', color: '#a78bfa' },
    { name: '毒牙', c1: '#8affb5', c2: '#1f7a3a', color: '#4ade80' },
    { name: '樱花', c1: '#ffb5d8', c2: '#8f2f5a', color: '#f472b6' },
  ];
  let carIdx = 0;

  // ---- 排行榜 ----
  let leaderboard = [];
  let ghostPool = [];      // 全部候选(按分数升序)
  let ghostCars = [];      // 同屏最多 3 辆
  const MAX_GHOSTS = 3;
  let myRank = -1;

  let state = 'menu';       // menu | run | over
  let score = 0, speed = 0, maxSpeed = 0, startTime = 0;
  let player = { x: W/2 - CAR_W/2, y: H - CAR_H - 24 };
  let cars = [];
  let pickups = [];          // {type:'boost'|'shield', x, y, lane}
  let hasShield = false, boostT = 0, combo = 0;
  let lastT = 0, spawnT = 0, pickT = 0, shake = 0;
  let touchX = null;
  let particles = [];
  let stars = [], buildings = [];

  // ---- 音频:必须在用户点击手势里 unlock,微信/iOS 否则一直静音 ----
  let actx = null, engineOsc = null, engineGain = null, engineFilter = null, masterGain = null;
  let padOsc = null, padGain = null, padFilter = null;
  let musicTimer = null, musicStep = 0, lastMusicT = 0, muted = false, audioReady = false;
  function connectOut(node) {
    if (masterGain) node.connect(masterGain);
    else node.connect(actx.destination);
  }
  async function unlockAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') await actx.resume();
      // iOS/微信解锁:播一段空 buffer
      const buf = actx.createBuffer(1, 1, 22050);
      const src = actx.createBufferSource();
      src.buffer = buf;
      src.connect(actx.destination);
      src.start(0);
      if (!masterGain) {
        masterGain = actx.createGain();
        masterGain.gain.value = muted ? 0 : 1;
        masterGain.connect(actx.destination);
      }
      if (!engineOsc) setupEngine();
      if (!padOsc) setupPad();
      if (!musicTimer) musicTimer = setInterval(stepMusic, 280);
      audioReady = true;
      beep(392, 0.12, 'square', 0.32);
      setTimeout(() => beep(523, 0.2, 'square', 0.3), 100);
    } catch (e) {}
  }
  function setupEngine() {
    engineOsc = actx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.value = 55;
    engineGain = actx.createGain();
    engineGain.gain.value = 0;
    engineFilter = actx.createBiquadFilter();
    engineFilter.type = 'lowpass'; engineFilter.frequency.value = 700;
    engineOsc.connect(engineFilter); engineFilter.connect(engineGain); connectOut(engineGain);
    engineOsc.start();
  }
  function initAudio() { unlockAudio(); }
  function setupPad() {
    // 持续垫底音:合成波背景,跑起来才有音量
    padOsc = actx.createOscillator();
    padOsc.type = 'sawtooth';
    padOsc.frequency.value = 110;
    padFilter = actx.createBiquadFilter();
    padFilter.type = 'lowpass';
    padFilter.frequency.value = 320;
    padGain = actx.createGain();
    padGain.gain.value = 0;
    padOsc.connect(padFilter); padFilter.connect(padGain); connectOut(padGain);
    padOsc.start();
  }
  function setPad(on) {
    if (!padGain || !actx) return;
    try {
      padGain.gain.setTargetAtTime(on ? 0.07 : 0, actx.currentTime, 0.15);
    } catch (e) {}
  }
  function stepMusic() {
    if (!actx || state !== 'run' || muted) return;
    try {
      const beat = musicStep % 8;
      kick(beat === 0 || beat === 4 ? 0.28 : 0.12);
      if (beat === 2 || beat === 6) hat(0.08);
      // 持续旋律:小调琶音,比单纯鼓点更像背景音
      const arp = [220, 261.6, 329.6, 392, 329.6, 261.6, 246.9, 196];
      tone(arp[musicStep % 8], 0.32, 0.07, 'triangle');
      if (musicStep % 4 === 0) {
        const bassN = [55, 55, 65.4, 49][(musicStep / 4) % 4 | 0];
        bass(bassN, 0.22);
      }
      if (padOsc) {
        const roots = [110, 110, 130.8, 98];
        padOsc.frequency.setTargetAtTime(roots[(musicStep / 8 | 0) % 4], actx.currentTime, 0.4);
      }
      musicStep = (musicStep + 1) % 32;
    } catch(e) {}
  }
  function tone(freq, dur, vol, type) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); connectOut(g);
    o.start(); o.stop(actx.currentTime + dur + 0.02);
  }
  function kick(vol) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(40, actx.currentTime + 0.12);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.14);
    o.connect(g); connectOut(g);
    o.start(); o.stop(actx.currentTime + 0.16);
  }
  function hat(vol) {
    if (!actx) return;
    const dur = 0.04, buf = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
    const src = actx.createBufferSource(); src.buffer = buf;
    const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
    const g = actx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); connectOut(g);
    src.start();
  }
  function bass(freq, vol) {
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + 0.2);
    o.connect(g); connectOut(g);
    o.start(); o.stop(actx.currentTime + 0.22);
  }
  function setEngine(p) {
    if (!engineOsc || !engineGain) return;
    try {
      const t = actx.currentTime;
      engineOsc.frequency.setTargetAtTime(55 + p * 180, t, 0.08);
      engineGain.gain.setTargetAtTime(0.12 + p * 0.16, t, 0.08);   // 0.12~0.28,微信也能听见
    } catch(e) {}
  }
  function beep(freq, dur, type, vol) {
    if (!actx) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square'; o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.14, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
      o.connect(g); connectOut(g);
      o.start(); o.stop(actx.currentTime + dur);
    } catch(e) {}
  }
  function crashSound() {
    if (!actx) return;
    try {
      const dur = 0.6, buf = actx.createBuffer(1, actx.sampleRate * dur, actx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
      const src = actx.createBufferSource(); src.buffer = buf;
      const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1200;
      const g = actx.createGain(); g.gain.value = 0.5;
      src.connect(f); f.connect(g); connectOut(g); src.start();
      // 金属撞击感:叠加高音
      beep(180, 0.18, 'square', 0.25);
    } catch(e) {}
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }

  // 背景
  for (let i = 0; i < 70; i++) stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.3+0.3, tw: Math.random()*6.28 });
  for (let i = 0; i < 8; i++) buildings.push({ x: Math.random()*W, w: rnd(18,40), h: rnd(40,140), c: `rgba(${Math.floor(rnd(30,70))},${Math.floor(rnd(40,90))},${Math.floor(rnd(90,150))},0.5)` });

  // ---- 车选择器 UI ----
  CAR_TYPES.forEach((ct, i) => {
    const el = document.createElement('div');
    el.className = 'carOption' + (i === 0 ? ' selected' : '');
    el.innerHTML = `<div class="miniCar" style="background:linear-gradient(180deg,${ct.c1},${ct.c2})"></div><span>${ct.name}</span>`;
    el.onclick = () => {
      carIdx = i;
      document.querySelectorAll('.carOption').forEach((o, j) => o.classList.toggle('selected', j === i));
      beep(440, 0.06, 'square', 0.06);
    };
    carPicker.appendChild(el);
  });

  // 记住昵称
  try { nameInput.value = localStorage.getItem('racerName') || ''; } catch(e) {}

  // ---- 排行榜 API ----
  const API = './.netlify/functions/leaderboard';
  async function fetchBoard() {
    try {
      const r = await fetch(API + '?t=' + Date.now(), { method: 'GET', cache: 'no-store' });
      if (!r.ok) return;
      const d = await r.json();
      if (Array.isArray(d)) leaderboard = d;
    } catch(e) { /* 离线可用 */ }
  }
  async function submitScore() {
    const name = (nameInput.value || '车手').trim() || '车手';
    try { localStorage.setItem('racerName', name); } catch(e) {}
    try {
      const r = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, score: Math.floor(score), carId: carIdx })
      });
      if (r.ok) {
        const d = await r.json();
        if (d && d.list) leaderboard = d.list;
        myRank = d && d.rank ? d.rank : -1;
      }
    } catch(e) {}
  }
  // 预取榜
  fetchBoard();

  function fmtTime(ts) {
    const d = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(d.getDate())}/${pad(d.getHours())}/${pad(d.getMinutes())}`;
  }

  // 幻影:同屏最多 3 辆;按分数区段排队入场;遵守车道/间距/不重叠
  function buildGhostPool() {
    const seen = new Set();
    ghostPool = [];
    for (const e of leaderboard) {
      const key = (e.name || '车手').trim();
      if (seen.has(key)) continue;
      seen.add(key);
      ghostPool.push({
        name: e.name,
        carId: e.carId || 0,
        score: e.score,
        used: false,
      });
    }
    ghostPool.sort((a, b) => a.score - b.score);
  }
  function laneCenter(lane, w) {
    return lane * LANE_W + LANE_W/2 - (w || CAR_W)/2;
  }
  function rectHit(a, b, pad) {
    const p = pad == null ? 8 : pad;
    return a.x < b.x + b.w - p && a.x + a.w > b.x + p &&
           a.y < b.y + b.h - p && a.y + a.h > b.y + p;
  }
  function occupiedInLane(lane, y, h, ignore) {
    const box = { x: laneCenter(lane), y, w: CAR_W, h: h || CAR_H };
    if (rectHit(box, { x: player.x, y: player.y, w: CAR_W, h: CAR_H }, 16)) return true;
    for (const o of cars) {
      if ((o.lane === lane || Math.abs((o.x + (o.w||CAR_W)/2) - (lane*LANE_W+LANE_W/2)) < LANE_W*0.4) &&
          rectHit(box, { x: o.x, y: o.y, w: o.w||CAR_W, h: o.h||CAR_H }, 18)) return true;
    }
    for (const p of pickups) {
      if (p.lane === lane && rectHit(box, { x: p.x, y: p.y, w: 30, h: 30 }, 10)) return true;
    }
    for (const g of ghostCars) {
      if (g === ignore) continue;
      if (g.lane === lane && rectHit(box, g, 20)) return true;
    }
    return false;
  }
  function pickFreeLane(prefer, y, h, ignore) {
    const order = [prefer, (prefer+1)%3, (prefer+2)%3];
    for (const L of order) {
      if (!occupiedInLane(L, y, h, ignore)) return L;
    }
    return prefer;
  }
  function makeGhost(entry, slot) {
    const myLane = Math.max(0, Math.min(2, Math.round((player.x + CAR_W/2) / LANE_W - 0.5)));
    let lane = (myLane + (slot % 2 === 0 ? 1 : -1) + ((slot/2)|0)) % LANES;
    if (lane < 0) lane += LANES;
    if (lane === myLane) lane = (lane + 1) % LANES;
    const startY = player.y - 100 - slot * 85;
    lane = pickFreeLane(lane, startY, CAR_H, null);
    return {
      name: entry.name,
      carId: entry.carId,
      score: entry.score,
      lane,
      x: laneCenter(lane),
      y: startY,
      startY,
      lerpT: 0,
      alive: true,
      fade: 1,
      w: CAR_W, h: CAR_H,
      ghostTag: true,
      blinkOn: false, blinkDir: 0, blinkT: 0,
    };
  }
  function refreshGhostHud() {
    if (!ghostHud) return;
    ghostHud.style.display = ghostCars.length ? 'block' : 'none';
    ghostHud.textContent = ghostCars.length ? ('幻影同场 ' + ghostCars.length + '/3') : '';
  }
  function fillGhostSlots() {
    while (ghostCars.length < MAX_GHOSTS) {
      const next = ghostPool.find(e => !e.used && e.score > score);
      if (!next) break;
      next.used = true;
      ghostCars.push(makeGhost(next, ghostCars.length));
    }
    refreshGhostHud();
  }
  function spawnGhosts() {
    ghostCars = [];
    buildGhostPool();
    fillGhostSlots();
  }

  function updateGhosts(dt) {
    for (let i = ghostCars.length - 1; i >= 0; i--) {
      const g = ghostCars[i];
      if (score >= g.score) {
        burst(g.x + CAR_W/2, g.y + CAR_H/2, 'rgba(255,220,120,0.9)', 14);
        ghostCars.splice(i, 1);
        continue;
      }
      const diff = g.score - score;
      const targetY = player.y - 50 - Math.min(1, diff / 2800) * 400;
      g.lerpT = Math.min(1, g.lerpT + dt / 2.0);
      let ny = g.startY + (targetY - g.startY) * g.lerpT;

      // 同车道与前车/其他幻影保持间距
      const GAP = CAR_H + 22;
      for (const o of ghostCars) {
        if (o === g || o.lane !== g.lane) continue;
        if (o.y < ny && ny - o.y < GAP) ny = o.y + GAP;
      }
      for (const o of cars) {
        if (o.lane !== g.lane) continue;
        const oh = o.h || CAR_H;
        if (o.y + oh > ny && o.y < ny + CAR_H + 20) {
          // 前方有车:尝试变道
          const nl = pickFreeLane(g.lane, ny, CAR_H, g);
          if (nl !== g.lane) {
            g.blinkOn = true; g.blinkDir = nl < g.lane ? -1 : 1; g.blinkT = 0;
            g.lane = nl;
          } else if (o.y > ny) {
            ny = o.y - GAP;
          }
        }
      }
      // 不与玩家重叠:同车道太近就变道
      if (g.lane === Math.round((player.x + CAR_W/2) / LANE_W - 0.5) &&
          Math.abs(ny - player.y) < CAR_H + 16) {
        const nl = pickFreeLane((g.lane + 1) % 3, ny, CAR_H, g);
        if (nl !== g.lane) {
          g.blinkOn = true; g.blinkDir = nl < g.lane ? -1 : 1; g.blinkT = 0;
          g.lane = nl;
        }
      }
      g.y = Math.max(8, Math.min(H - CAR_H - 8, ny));
      const tx = laneCenter(g.lane);
      g.x += (tx - g.x) * Math.min(1, dt * 8);
      if (g.blinkOn) {
        g.blinkT += dt;
        if (g.blinkT > 0.6) g.blinkOn = false;
      }
    }
    fillGhostSlots();
  }

  async function reset() {
    await unlockAudio();
    if (!leaderboard.length) await fetchBoard();
    score = 0; speed = 110; maxSpeed = 0; combo = 0;
    cars = []; pickups = []; particles = [];
    hasShield = false; boostT = 0;
    spawnT = 0.4; pickT = 2.5; shake = 0;
    startTime = Date.now();
    player.x = W/2 - CAR_W/2;
    badge.style.display = 'none';
    state = 'run';
    overlay.style.display = 'none';
    spawnGhosts();
    setPad(true);
  }

  const TRAFFIC = [
    { id: 'sedan', w: 44, h: 74, weight: 3 },
    { id: 'taxi', w: 44, h: 74, weight: 2 },
    { id: 'truck', w: 52, h: 128, weight: 2 },
    { id: 'van', w: 48, h: 96, weight: 2 },
    { id: 'police', w: 46, h: 78, weight: 1 },
    { id: 'ambulance', w: 50, h: 92, weight: 1 },
  ];
  function pickTraffic() {
    const bag = [];
    TRAFFIC.forEach(t => { for (let i = 0; i < t.weight; i++) bag.push(t); });
    return bag[Math.floor(Math.random() * bag.length)];
  }
  function spawnCar() {
    const spec = pickTraffic();
    const lane = Math.floor(Math.random() * LANES);
    const cx = lane * LANE_W + LANE_W/2 - spec.w/2;
    const hostile = spec.id !== 'truck' && Math.random() < 0.35;
    cars.push({
      x: cx, y: -spec.h - rnd(0, 80), lane,
      w: spec.w, h: spec.h, vType: spec.id,
      color: spec.id === 'sedan' ? rndColor() : undefined,
      hostile, hDir: Math.random()<0.5?1:-1, hT: 0,
      changeAt: rnd(1.2, 2.4), blinkOn: false, blinkDir: 0, blinkT: 0
    });
  }
  function spawnPickup(attempt) {
    if (!attempt) attempt = 0;
    if (attempt > 3) return;  // 有界重试,避免无限递归
    const types = ['boost','shield'];
    // 选一个顶部区域无车的车道,道具不叠在车上
    const lanes = [0, 1, 2].sort(() => Math.random() - 0.5);
    let lane = lanes[0];
    for (const L of lanes) {
      let occupied = false;
      for (const c of cars) {
        if (c.lane === L && c.y < CAR_H + 60) { occupied = true; break; }
      }
      if (!occupied) { lane = L; break; }
    }
    const cx = lane * LANE_W + LANE_W/2 - CAR_W/2;
    // 道具与已有道具保持间距(同车道顶部无道具)
    for (const p of pickups) {
      if (p.lane === lane && p.y < 80) { spawnPickup(attempt + 1); return; }
    }
    pickups.push({ type: types[Math.floor(Math.random()*types.length)], x: cx, y: -30, lane: lane });
  }

  function rndColor() {
    const cs = ['#ff5d5d','#ffb545','#4dd0e1','#a78bfa','#f472b6','#4ade80','#ff9d4d'];
    return cs[Math.floor(Math.random() * cs.length)];
  }

  function drawStars(t) {
    for (const s of stars) {
      const a = 0.4 + 0.5 * Math.sin(t * 2 + s.tw);
      ctx.fillStyle = `rgba(200,215,255,${a * 0.7})`;
      ctx.beginPath(); ctx.arc(s.x, (s.y + t * 12) % H, s.r, 0, 7); ctx.fill();
    }
  }
  function drawCity() {
    for (const b of buildings) {
      ctx.fillStyle = b.c;
      ctx.fillRect(b.x, H - b.h, b.w, b.h);
      ctx.fillStyle = 'rgba(255,200,120,0.25)';
      for (let wy = H - b.h + 6; wy < H - 4; wy += 14)
        for (let wx = b.x + 4; wx < b.x + b.w - 4; wx += 10)
          if (Math.random() < 0.3) ctx.fillRect(wx, wy, 3, 4);
    }
  }

  function drawRoad(t) {
    ctx.fillStyle = '#0a0d16';
    ctx.fillRect(0, 0, W, H);
    drawCity();
    drawStars(t);
    ctx.fillStyle = '#10151f';
    ctx.fillRect(16, 0, W-32, H);
    ctx.fillStyle = '#1a2233';
    ctx.fillRect(10, 0, 6, H);
    ctx.fillRect(W-16, 0, 6, H);
    ctx.strokeStyle = '#3d4a5c';
    ctx.lineWidth = 3;
    ctx.setLineDash([26, 22]);
    ctx.lineDashOffset = -(t * speed * 0.28);   // 速度感:标线随速度快速流动
    for (let i = 1; i < LANES; i++) {
      ctx.beginPath();
      ctx.moveTo(i * LANE_W, 0);
      ctx.lineTo(i * LANE_W, H);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    // 高速风线:两侧竖直流动短线,速度越快越密越长
    if (speed > 180) {
      const dens = (speed - 180) / 260;
      ctx.strokeStyle = 'rgba(160,200,255,0.28)';
      ctx.lineWidth = 1;
      for (let i = 0; i < 10; i++) {
        const sx = (i % 2 === 0) ? 2 : W - 2;
        let sy = ((i * 97 + t * speed * 2.2) % (H + 80)) - 40;
        const len = 12 + dens * 30;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx, sy + len);
        ctx.stroke();
      }
    }
    const tt = t / 150;
    for (const side of [10, W-10]) {
      ctx.fillStyle = '#ff2d78';
      for (let i = 0; i < 6; i++) {
        let yy = ((i * 110 + tt * speed * 1.1) % (H + 60)) - 30;
        ctx.beginPath(); ctx.arc(side, yy, 3.5, 0, 7); ctx.fill();
        ctx.fillStyle = '#ffd166';
        ctx.beginPath(); ctx.arc(side, (yy + 55) % (H + 60), 3.5, 0, 7); ctx.fill();
        ctx.fillStyle = '#ff2d78';
      }
    }
  }

  function drawCar(c, isPlayer, alpha) {
    const w = c.w || CAR_W, h = c.h || CAR_H;
    const vType = isPlayer ? 'player' : (c.ghostTag || c.name ? 'ghost' : (c.vType || 'sedan'));
    ctx.save();
    if (alpha !== undefined) ctx.globalAlpha = alpha;
    ctx.translate(c.x + w/2, c.y + h/2);

    if (vType === 'player' || vType === 'ghost') {
      let ct = CAR_TYPES[(isPlayer ? carIdx : (c.carId || 0)) % CAR_TYPES.length];
      const grad = ctx.createLinearGradient(0, -h/2, 0, h/2);
      grad.addColorStop(0, ct.c1); grad.addColorStop(0.5, '#3a3f5a'); grad.addColorStop(1, ct.c2);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-w/2 + 10, -h/2);
      ctx.quadraticCurveTo(-w/2 + 4, -h/2 + 8, -w/2 + 2, -h/2 + 22);
      ctx.lineTo(-w/2 + 2, h/2 - 6);
      ctx.quadraticCurveTo(-w/2 + 2, h/2, -w/2 + 8, h/2);
      ctx.lineTo(w/2 - 8, h/2);
      ctx.quadraticCurveTo(w/2 - 2, h/2, w/2 - 2, h/2 - 6);
      ctx.lineTo(w/2 - 2, -h/2 + 22);
      ctx.quadraticCurveTo(w/2 - 4, -h/2 + 8, w/2 - 10, -h/2);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(12,20,36,.92)';
      ctx.beginPath();
      ctx.moveTo(-w/2 + 9, -h/2 + 24);
      ctx.quadraticCurveTo(0, -h/2 + 10, w/2 - 9, -h/2 + 24);
      ctx.lineTo(w/2 - 10, -h/2 + 40);
      ctx.lineTo(-w/2 + 10, -h/2 + 40);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = isPlayer ? '#eaffff' : '#ffd9a8';
      roundRect(-w/2 + 5, -h/2 + 1, 11, 5, 2); ctx.fill();
      roundRect(w/2 - 16, -h/2 + 1, 11, 5, 2); ctx.fill();
      ctx.fillStyle = '#ff2d4a';
      roundRect(-w/2 + 4, h/2 - 5, 10, 5, 2); ctx.fill();
      roundRect(w/2 - 14, h/2 - 5, 10, 5, 2); ctx.fill();
      ctx.fillStyle = '#0a0e16';
      ctx.fillRect(-w/2 + 1, -h/2 + 30, 6, 18);
      ctx.fillRect(w/2 - 7, -h/2 + 30, 6, 18);
      ctx.fillRect(-w/2 + 1, h/2 - 26, 6, 18);
      ctx.fillRect(w/2 - 7, h/2 - 26, 6, 18);
      if (vType === 'ghost') {
        ctx.strokeStyle = 'rgba(120,220,255,0.95)';
        ctx.lineWidth = 3;
        ctx.setLineDash([6, 4]);
        roundRect(-w/2 - 4, -h/2 - 4, w + 8, h + 8, 12); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(8,16,28,0.85)';
        const label = (c.name || '车手') + ' ' + Math.floor(c.score);
        ctx.font = 'bold 11px sans-serif';
        const tw = ctx.measureText(label).width + 10;
        roundRect(-tw/2, -h/2 - 22, tw, 16, 4); ctx.fill();
        ctx.fillStyle = '#9ad4ff';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(label, 0, -h/2 - 14);
      }
      if (isPlayer && hasShield) {
        ctx.strokeStyle = 'rgba(80,180,255,0.7)';
        ctx.lineWidth = 3;
        roundRect(-w/2 - 6, -h/2 - 6, w + 12, h + 12, 14); ctx.stroke();
      }
    } else {
      drawTrafficBody(c, w, h);
    }

    // 转向灯(所有车)
    if (c.blinkOn && (Math.floor((c.blinkT || 0) * 2) % 2 === 0)) {
      const blinkX = c.blinkDir < 0 ? -w/2 - 1 : w/2 - 7;
      ctx.fillStyle = 'rgba(255,209,102,0.4)';
      ctx.beginPath(); ctx.arc(blinkX + 3, -h/2 + 12, 10, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(blinkX + 3, h/2 - 8, 10, 0, 7); ctx.fill();
      ctx.fillStyle = '#ffe27a';
      ctx.fillRect(blinkX, -h/2 + 8, 8, 8);
      ctx.fillRect(blinkX, h/2 - 12, 8, 8);
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function drawTrafficBody(c, w, h) {
    const t = c.vType || 'sedan';
    if (t === 'truck') {
      ctx.fillStyle = '#4a5568';
      roundRect(-w/2, -h/2 + 36, w, h - 36, 4); ctx.fill();
      ctx.fillStyle = '#2d3748';
      roundRect(-w/2 + 2, -h/2, w - 4, 40, 6); ctx.fill();
      ctx.fillStyle = 'rgba(20,30,50,.9)';
      roundRect(-w/2 + 6, -h/2 + 8, w - 12, 18, 3); ctx.fill();
      ctx.fillStyle = '#cbd5e0';
      for (let i = 0; i < 3; i++) ctx.fillRect(-w/2 + 6, -h/2 + 48 + i * 22, w - 12, 3);
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(-w/2 + 4, -h/2 + 2, 10, 5);
      ctx.fillRect(w/2 - 14, -h/2 + 2, 10, 5);
    } else if (t === 'van') {
      ctx.fillStyle = '#718096';
      roundRect(-w/2, -h/2 + 8, w, h - 8, 6); ctx.fill();
      ctx.fillStyle = '#2d3748';
      roundRect(-w/2 + 3, -h/2, w - 6, 28, 6); ctx.fill();
      ctx.fillStyle = 'rgba(20,30,50,.9)';
      roundRect(-w/2 + 7, -h/2 + 6, w - 14, 16, 3); ctx.fill();
    } else if (t === 'taxi') {
      ctx.fillStyle = '#f6e05e';
      roundRect(-w/2 + 2, -h/2 + 8, w - 4, h - 10, 8); ctx.fill();
      ctx.fillStyle = '#1a202c';
      roundRect(-w/2 + 8, -h/2 + 18, w - 16, 18, 4); ctx.fill();
      ctx.fillStyle = '#2d3748';
      roundRect(-w/2 + 12, -h/2, w - 24, 10, 2); ctx.fill();
      ctx.fillStyle = '#1a202c';
      ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('TAXI', 0, 8);
    } else if (t === 'police') {
      ctx.fillStyle = '#edf2f7';
      roundRect(-w/2 + 2, -h/2 + 6, w - 4, h - 8, 8); ctx.fill();
      ctx.fillStyle = '#2b6cb0';
      ctx.fillRect(-w/2 + 2, -h/2 + 28, w - 4, 14);
      ctx.fillStyle = 'rgba(20,30,50,.9)';
      roundRect(-w/2 + 8, -h/2 + 12, w - 16, 14, 3); ctx.fill();
      const flash = Math.floor(performance.now() / 180) % 2 === 0;
      ctx.fillStyle = flash ? '#e53e3e' : '#3182ce';
      ctx.fillRect(-8, -h/2, 7, 7);
      ctx.fillStyle = flash ? '#3182ce' : '#e53e3e';
      ctx.fillRect(1, -h/2, 7, 7);
    } else if (t === 'ambulance') {
      ctx.fillStyle = '#edf2f7';
      roundRect(-w/2, -h/2 + 10, w, h - 10, 6); ctx.fill();
      ctx.fillStyle = '#e53e3e';
      ctx.fillRect(-w/2, -h/2 + 36, w, 10);
      ctx.fillStyle = '#e53e3e';
      ctx.fillRect(-5, -h/2 + 22, 10, 36);
      ctx.fillStyle = 'rgba(20,30,50,.9)';
      roundRect(-w/2 + 6, -h/2 + 14, w - 12, 14, 3); ctx.fill();
      const flash = Math.floor(performance.now() / 160) % 2 === 0;
      ctx.fillStyle = flash ? '#e53e3e' : '#fff';
      ctx.fillRect(-10, -h/2, 20, 8);
    } else {
      // sedan
      ctx.fillStyle = c.color || '#63b3ed';
      roundRect(-w/2 + 2, -h/2 + 8, w - 4, h - 10, 9); ctx.fill();
      ctx.fillStyle = 'rgba(12,20,36,.9)';
      roundRect(-w/2 + 8, -h/2 + 16, w - 16, 20, 5); ctx.fill();
      ctx.fillStyle = '#ffd9a8';
      ctx.fillRect(-w/2 + 6, -h/2 + 4, 10, 5);
      ctx.fillRect(w/2 - 16, -h/2 + 4, 10, 5);
    }
    ctx.fillStyle = '#0a0e16';
    ctx.fillRect(-w/2 + 1, -h/2 + 28, 6, 16);
    ctx.fillRect(w/2 - 7, -h/2 + 28, 6, 16);
    ctx.fillRect(-w/2 + 1, h/2 - 22, 6, 16);
    ctx.fillRect(w/2 - 7, h/2 - 22, 6, 16);
    ctx.fillStyle = '#ff2d4a';
    ctx.fillRect(-w/2 + 5, h/2 - 6, 9, 4);
    ctx.fillRect(w/2 - 14, h/2 - 6, 9, 4);
  }

  function drawPickups(t) {
    for (const p of pickups) {
      const pulse = 1 + 0.15 * Math.sin(t * 5 + p.x);
      ctx.save();
      ctx.translate(p.x + CAR_W/2, p.y + CAR_W/2);
      ctx.scale(pulse, pulse);
      if (p.type === 'boost') {
        ctx.fillStyle = '#ffd166';
        ctx.strokeStyle = '#fff3c4';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 3; i++) {
          ctx.rotate(Math.PI * 2 / 3);
          ctx.lineTo(0, -14); ctx.lineTo(4, 0); ctx.lineTo(0, 14); ctx.lineTo(-4, 0);
        }
        ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('▶', 0, 1);
      } else {
        ctx.fillStyle = '#4dd0e1';
        ctx.strokeStyle = '#c2f4ff';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, 0, 14, 0, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('✦', 0, 1);
      }
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const pt of particles) {
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.color;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, 6.28), sp = rnd(30, 220);
      particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, r: rnd(1.5, 4), life: 1, decay: rnd(1.5, 3), color });
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function update(dt) {
    speed = Math.min(speed + dt * 14, boostT > 0 ? 620 : 440);
    maxSpeed = Math.max(maxSpeed, speed);
    const mult = boostT > 0 ? 2 : 1;
    score += dt * speed * 0.06 * mult;

    const diff = Math.min(1, score / 3000);
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnCar();
      spawnT = rnd(0.42, 0.95) * (420 / speed) * (1.5 - diff * 0.5);
      if (Math.random() < 0.3) spawnCar();
    }
    pickT -= dt;
    if (pickT <= 0) {
      spawnPickup();
      pickT = rnd(4, 7);
    }

    // 敌车移动 + 碰撞
    for (let i = cars.length - 1; i >= 0; i--) {
      const c = cars[i];
      const cw = c.w || CAR_W, ch = c.h || CAR_H;
      c.y += speed * dt * 0.34;

      // 同车道后车保持间距
      const GAP = ch + 26;
      for (let j = 0; j < cars.length; j++) {
        if (j === i) continue;
        const o = cars[j];
        const oh = o.h || CAR_H;
        if (o.lane === c.lane && o.y > c.y && o.y - (c.y + ch) + oh < GAP) {
          c.y -= speed * dt * 0.10;
          break;
        }
      }

      if (c.hostile && c.y > 60 && c.y < H * 0.6) {
        c.hT += dt;
        // 转向灯:变道前 0.6s 亮起
        if (!c.blinkOn && c.hT > c.changeAt - 0.6) {
          c.blinkOn = true;
          c.blinkDir = c.hDir;
          c.blinkT = 0;
        }
        if (c.blinkOn) c.blinkT += dt;
        if (c.hT > c.changeAt) {
          const nl = Math.max(0, Math.min(LANES-1, c.lane + c.hDir));
          // 变道前检查目标车道:同屏段有车就不变(避免重叠),换方向
          let blocked = false;
          for (let j = 0; j < cars.length; j++) {
            const o = cars[j];
            if (o.lane === nl && Math.abs(o.y - c.y) < CAR_H + 40) { blocked = true; break; }
          }
          if (!blocked && nl !== c.lane) {
            c.lane = nl; c.x = nl * LANE_W + LANE_W/2 - cw/2;
          }
          c.hT = 0; c.blinkOn = false; c.changeAt = rnd(1.2, 2.4);
          // 变道或受阻后随机换方向,防止反复横跳
          if (blocked) c.hDir *= -1;
        }
      }
      if (c.y > H + 40) { cars.splice(i, 1); continue; }
      if (state === 'run' &&
          c.y < player.y + CAR_H - 8 && c.y + ch > player.y + 8 &&
          c.x < player.x + CAR_W - 8 && c.x + cw > player.x + 8) {
        if (hasShield) {
          hasShield = false;
          burst(player.x + CAR_W/2, player.y + CAR_H/2, '#4dd0e1', 26);
          beep(320, 0.15, 'triangle', 0.2);
          badge.style.display = 'block';
          badge.textContent = '护盾挡下了!';
          setTimeout(() => { badge.style.display = 'none'; }, 1200);
          cars.splice(i, 1);
          continue;
        }
        state = 'over'; shake = 1;
        burst(player.x + CAR_W/2, player.y + CAR_H/2, '#ff2d4a', 40);
        burst(player.x + CAR_W/2, player.y + CAR_H/2, '#ffd166', 24);
        crashSound();
        setEngine(0);
        showOver();
      }
    }

    // 道具
    for (let i = pickups.length - 1; i >= 0; i--) {
      const p = pickups[i];
      p.y += speed * dt * 0.34;
      if (p.y > H + 40) { pickups.splice(i, 1); continue; }
      if (state === 'run' &&
          p.y < player.y + CAR_H && p.y + 30 > player.y &&
          p.x + CAR_W/2 > player.x && p.x + CAR_W/2 < player.x + CAR_W) {
        if (p.type === 'boost') {
          boostT = 2.5; combo++;
          burst(p.x + CAR_W/2, p.y + 15, '#ffd166', 20);
          beep(660, 0.12, 'square', 0.15);
          setTimeout(() => beep(880, 0.12, 'square', 0.12), 80);
          badge.style.display = 'block';
          badge.textContent = '加速!! ×' + (combo >= 2 ? combo + ' 连' : '2 倍分');
          setTimeout(() => { badge.style.display = 'none'; }, 1400);
        } else {
          hasShield = true;
          burst(p.x + CAR_W/2, p.y + 15, '#4dd0e1', 16);
          beep(520, 0.2, 'sine', 0.2);
          badge.style.display = 'block';
          badge.textContent = '护盾就位';
          setTimeout(() => { badge.style.display = 'none'; }, 1200);
        }
        pickups.splice(i, 1);
      }
    }
    if (boostT > 0) boostT -= dt;

    // 幻影车:伪联机陪跑(分数对齐)
    updateGhosts(dt);

    // 粒子
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.98; pt.vy *= 0.98;
      pt.life -= pt.decay * dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }
    if (Math.random() < 0.5) {
      particles.push({ x: player.x + CAR_W/2 + rnd(-8,8), y: player.y + CAR_H, vx: rnd(-15,15), vy: rnd(60,120) * (boostT>0?1.6:1), r: rnd(1.5,3.5), life: 0.8, decay: 2.2, color: boostT>0 ? '#ffd166' : 'rgba(127,176,255,0.7)' });
    }

    if (shake > 0) shake = Math.max(0, shake - dt * 3);
  }

  // 排行榜渲染
  function renderBoard(mode) {
    // mode: 'over' 撞车页 / 'menu' 菜单页
    let html = '';
    const show = leaderboard.slice(0, 8);
    if (!show.length) html = '<div class="row"><span>暂无记录,快来跑第一!</span></div>';
    else {
      show.forEach((e, i) => {
        html += `<div class="row"><span class="r">${i+1}</span><span class="n">${e.name}</span><span class="t">${fmtTime(e.ts)}</span><span class="s">${Math.floor(e.score)}</span></div>`;
      });
    }
    if (myRank > 0) {
      html += `<div class="row" style="color:#4ade80"><span class="r">★</span><span class="n">你的排名</span><span class="t"></span><span class="s">#${myRank}</span></div>`;
    }
    return `<div class="board">${html}</div>`;
  }

  function showOver() {
    setPad(false);
    overlaySub.style.display = 'none';
    overlayLegend.style.display = 'none';
    carPicker.style.display = 'none';
    nameInput.style.display = 'none';
    submitScore();
    setTimeout(() => {
      overlay.innerHTML =
        '<h1>撞车了</h1>' +
        '<div class="score">' + Math.floor(score) + '</div>' +
        '<div class="stat">最高速度 ' + Math.floor(maxSpeed) + ' km/h' + (combo >= 2 ? ' · 加速连击 ×' + combo : '') + '</div>' +
        (myRank > 0 ? '<div id="rankBadge">排行榜第 ' + myRank + ' 名!</div>' : '') +
        renderBoard('over') +
        '<button id="againBtn">再来一局</button>' +
        '<button id="boardBtn" class="secondary">查看完整榜</button>' +
        '<div class="sub">活着的时候可以截图发群里比比分</div>';
      overlay.style.display = 'flex';
      document.getElementById('againBtn').onclick = reset;
      const boardBtn = document.getElementById('boardBtn');
      if (boardBtn) boardBtn.onclick = showMenuBoard;
    }, 300);
  }

  function showMenuBoard() {
    overlay.innerHTML =
      '<h1>排行榜</h1>' +
      renderBoard('menu') +
      '<button id="backBtn" class="secondary">返回</button>';
    overlay.style.display = 'flex';
    document.getElementById('backBtn').onclick = backToMenu;
  }
  function backToMenu() {
    state = 'menu';
    overlay.innerHTML =
      '<h1>午夜霓虹</h1>' +
      '<div class="sub" id="overlaySub">霓虹夜路 · 极速狂飙<br>躲开对向车,蹭金色加速带,捡蓝色护盾<br>排行榜记录里的车手会以幻影与你同跑</div>' +
      '<div class="legend" id="overlayLegend">' + overlayLegend.innerHTML + '</div>' +
      '<div class="carPicker" id="carPicker"></div>' +
      '<input class="nameInput" id="nameInput" maxlength="12" placeholder="输入昵称(默认:车手)">' +
      '<button id="startBtn">发车</button>';
    // 重建 picker/input
    overlaySub.style.display = '';
    overlayLegend.style.display = '';
    carPicker.style.display = '';
    nameInput.style.display = '';
    // 重新绑定(简化:直接 location.reload 也行,但保留状态)
    // 由于 JS 引用了旧节点,这里用 location.reload 保证状态干净
    location.reload();
  }

  function loop(t) {
    const dt = Math.min((t - lastT) / 1000, 0.05);
    lastT = t;

    if (state === 'run') {
      movePlayer(dt);
      setEngine(Math.min(1, speed / 500));
    } else {
      setEngine(0);
    }

    drawRoad(t);
    if (state === 'run') update(dt);

    ctx.save();
    if (shake > 0) ctx.translate(rnd(-shake*6, shake*6), rnd(-shake*6, shake*6));

    drawPickups(t);
    // 幻影车画在敌车下面(半透明)
    for (const g of ghostCars) if (g.alive) drawCar(g, false, 0.92);
    for (const c of cars) drawCar(c, false);
    drawCar(player, true);
    drawParticles();
    ctx.restore();

    if (state !== 'menu') {
      // 显示速度映射到物理合理范围:内部 110-440(boost 620) → 显示 50-220 km/h
      const shown = Math.floor(speed * 0.5);
      speedHud.textContent = shown + ' km/h' + (boostT > 0 ? ' ⚡' : '');
      scoreHud.textContent = Math.floor(score);
    }
    requestAnimationFrame(loop);
  }

  // ---- 输入 ----
  const KEYMAP = { ArrowLeft: -1, ArrowRight: 1, a: -1, d: 1, A: -1, D: 1 };
  const keys = {};

  window.addEventListener('keydown', e => {
    if (KEYMAP[e.key] !== undefined) { keys[e.key] = true; e.preventDefault(); }
    if (e.key === 'Enter' && state === 'menu') reset();
  });
  window.addEventListener('keyup', e => { keys[e.key] = false; });

  function movePlayer(dt) {
    let dir = 0;
    if (keys.ArrowLeft || keys.a || keys.A) dir -= 1;
    if (keys.ArrowRight || keys.d || keys.D) dir += 1;
    if (touchX !== null) {
      const target = touchX - CAR_W / 2;
      const diff = target - player.x;
      dir = Math.abs(diff) > 6 ? Math.sign(diff) : 0;
      player.x += diff * Math.min(1, dt * 12);
    }
    if (dir !== 0) {
      player.x += dir * 340 * dt;
    }
    player.x = Math.max(14, Math.min(W - CAR_W - 14, player.x));
  }

  function toCanvasX(clientX) {
    const r = cv.getBoundingClientRect();
    return (clientX - r.left) * (W / r.width);
  }
  cv.addEventListener('touchstart', e => {
    e.preventDefault();
    initAudio();
    touchX = toCanvasX(e.touches[0].clientX);
    if (state === 'menu') reset();
  }, { passive: false });
  cv.addEventListener('touchmove', e => {
    e.preventDefault();
    touchX = toCanvasX(e.touches[0].clientX);
  }, { passive: false });
  cv.addEventListener('touchend', () => { touchX = null; });

  cv.addEventListener('mousedown', e => {
    initAudio();
    touchX = toCanvasX(e.clientX);
    if (state === 'menu') reset();
  });
  window.addEventListener('mousemove', e => {
    if (touchX === null) return;
    touchX = toCanvasX(e.clientX);
  });
  window.addEventListener('mouseup', () => { touchX = null; });

  // ---- 转发 ----
  const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M16 9a4 4 0 010 6"/><path d="M18.5 6.5a8 8 0 010 11"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l5 4V6L7 10H4z"/><path d="M16 9.5l6 6M22 9.5l-6 6"/></svg>';
  const ICON_SHARE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.4"/><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="19" r="2.4"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/></svg>';
  const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.2 4.2L19 7.5"/></svg>';

  shareBtn.addEventListener('click', async () => {
    const url = location.href;
    try {
      if (navigator.share) {
        await navigator.share({ title: '午夜霓虹 · 极速赛车', text: '来和我飙一把!', url });
        return;
      }
    } catch(e) {}
    try {
      await navigator.clipboard.writeText(url);
      shareBtn.classList.add('is-ok');
      shareBtn.innerHTML = ICON_OK;
      setTimeout(() => { shareBtn.classList.remove('is-ok'); shareBtn.innerHTML = ICON_SHARE; }, 1200);
    } catch(e) {}
  });

  muteBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    await unlockAudio();
    muted = !muted;
    if (masterGain) masterGain.gain.value = muted ? 0 : 1;
    muteBtn.classList.toggle('is-off', muted);
    muteBtn.innerHTML = muted ? ICON_OFF : ICON_ON;
    if (!muted) beep(660, 0.1, 'square', 0.25);
  });

  startBtn.onclick = () => { reset(); };
  // 任何首次点击都尝试解锁音频
  document.addEventListener('pointerdown', () => { unlockAudio(); }, { once: true });
  requestAnimationFrame(loop);

  // 调试/测试接口(生产无害)
  window.__game = {
    get ghostCars() { return ghostCars; },
    get leaderboard() { return leaderboard; },
    get player() { return player; },
    get cars() { return cars; },
    get state() { return state; },
    get score() { return Math.floor(score); },
    get carIdx() { return carIdx; },
    setLeaderboard(list) { leaderboard = Array.isArray(list) ? list : []; },
    setScore(n) { score = Math.max(0, Number(n) || 0); },
    get ghostPool() { return ghostPool; },
  };
})();
</script>
</body>
</html>
